<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আপনার জন্য একটি ভালোবাসা ভরা চিঠি ❤️</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Bengali & Romantic Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;600;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Anek Bangla', sans-serif;
            background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 50%, #fda4af 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .font-handwriting {
            font-family: 'Dancing Script', cursive;
        }

        /* Floating Hearts Animation Background */
        .heart-particle {
            position: absolute;
            bottom: -20px;
            color: rgba(244, 63, 94, 0.5);
            animation: floatUp 6s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) rotate(360deg) scale(1.3);
                opacity: 0;
            }
        }

        /* 3D Envelope Styles & Animations */
        .envelope-wrapper {
            perspective: 1000px;
        }

        .envelope {
            position: relative;
            width: 320px;
            height: 220px;
            background-color: #f43f5e;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            box-shadow: 0 20px 30px rgba(225, 29, 72, 0.25), 0 8px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.4s ease;
        }

        @media (min-width: 640px) {
            .envelope {
                width: 440px;
                height: 290px;
            }
        }

        .envelope:hover {
            transform: translateY(-8px);
        }

        /* Envelope Flap */
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 135px solid #e11d48;
            transform-origin: top;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.2s ease;
            z-index: 5;
        }

        @media (min-width: 640px) {
            .envelope-flap {
                border-left-width: 220px;
                border-right-width: 220px;
                border-top-width: 175px;
            }
        }

        .envelope.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        /* Pocket (front folds) */
        .envelope-pocket-left {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid #fb7185;
            border-top: 110px solid transparent;
            border-bottom: 110px solid #fb7185;
            border-bottom-left-radius: 12px;
            z-index: 4;
        }

        .envelope-pocket-right {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 0;
            height: 0;
            border-right: 160px solid #fb7185;
            border-top: 110px solid transparent;
            border-bottom: 110px solid #fb7185;
            border-bottom-right-radius: 12px;
            z-index: 4;
        }

        .envelope-pocket-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-bottom: 120px solid #f43f5e;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            z-index: 4;
        }

        @media (min-width: 640px) {
            .envelope-pocket-left {
                border-left-width: 220px;
                border-top-width: 145px;
                border-bottom-width: 145px;
            }
            .envelope-pocket-right {
                border-right-width: 220px;
                border-top-width: 145px;
                border-bottom-width: 145px;
            }
            .envelope-pocket-bottom {
                border-left-width: 220px;
                border-right-width: 220px;
                border-bottom-width: 160px;
            }
        }

        /* Heart Seal */
        .heart-seal {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45px;
            height: 45px;
            background: #be123c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 6;
            transition: opacity 0.5s ease, transform 0.5s ease;
            animation: pulseGlow 2s infinite;
        }

        @media (min-width: 640px) {
            .heart-seal {
                top: 135px;
                width: 55px;
                height: 55px;
            }
        }

        @keyframes pulseGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 rgba(190, 18, 60, 0.7); }
            50% { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 0 12px rgba(190, 18, 60, 0); }
        }

        .envelope.open .heart-seal {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.5);
        }

        /* Letter Parchment */
        .letter {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 90%;
            background: #fffdfa;
            background-image: radial-gradient(#fecdd3 0.75px, transparent 0.75px);
            background-size: 12px 12px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            padding: 20px;
            z-index: 3;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.4s, opacity 0.5s ease;
            opacity: 0;
            overflow: hidden;
        }

        /* Expanded Letter overlay state */
        .letter-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 92%;
            max-width: 620px;
            max-height: 85vh;
            background: #fffdfa;
            border: 2px solid #fecdd3;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(225, 29, 72, 0.25);
            padding: 28px 24px;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow-y: auto;
        }

        .letter-modal.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        /* Typewriter Cursor */
        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.1em;
            background-color: #e11d48;
            margin-left: 2px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Custom Scrollbar for Letter Modal */
        .letter-modal::-webkit-scrollbar {
            width: 6px;
        }
        .letter-modal::-webkit-scrollbar-track {
            background: #fff0f3;
            border-radius: 10px;
        }
        .letter-modal::-webkit-scrollbar-thumb {
            background: #fda4af;
            border-radius: 10px;
        }

        /* Audio Visualizer Pulse */
        .music-pulse {
            animation: pulseMusic 1.5s infinite alternate;
        }
        @keyframes pulseMusic {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between items-center relative overflow-x-hidden p-4">

    <!-- Container for Background Floating Hearts -->
    <div id="hearts-container" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- Top Control Bar (Audio, Edit, Reset) -->
    <header class="w-full max-w-4xl flex justify-between items-center z-10 pt-2 px-2">
        <div class="flex items-center gap-2">
            <span class="text-rose-600 font-bold text-xl tracking-wide flex items-center gap-2">
                <i class="fa-solid fa-heart text-rose-500 animate-bounce"></i> 
                <span class="hidden sm:inline">লাভ লেটার</span>
            </span>
        </div>

        <div class="flex items-center gap-3">
            <!-- Edit Letter Button -->
            <button id="editBtn" title="চিঠি এডিট করুন" class="flex items-center gap-2 bg-white/80 hover:bg-white text-rose-600 font-medium px-4 py-2 rounded-full shadow-md backdrop-blur-sm transition-all transform hover:scale-105 active:scale-95 text-sm">
                <i class="fa-solid fa-pen-to-square"></i>
                <span class="hidden sm:inline">এডিট করুন</span>
            </button>

            <!-- Audio Toggle Button -->
            <button id="musicBtn" title="মিউজিক অন/অফ" class="flex items-center justify-center w-10 h-10 bg-white/80 hover:bg-white text-rose-600 rounded-full shadow-md backdrop-blur-sm transition-all transform hover:scale-105 active:scale-95">
                <i id="musicIcon" class="fa-solid fa-music"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col items-center justify-center relative w-full my-8 z-10">
        
        <!-- Instruction Label -->
        <div id="instruction" class="text-center mb-8 transition-opacity duration-500">
            <h1 class="text-2xl sm:text-3xl font-bold text-rose-800 mb-2">আপনার জন্য একটি বিশেষ বার্তা! ❤️</h1>
            <p class="text-rose-600 text-sm sm:text-base animate-pulse">খামের সিলটিতে অথবা খামে ক্লিক করে খুলুন</p>
        </div>

        <!-- 3D Envelope Container -->
        <div class="envelope-wrapper">
            <div id="envelope" class="envelope">
                <div class="envelope-flap"></div>
                <div class="envelope-pocket-left"></div>
                <div class="envelope-pocket-right"></div>
                <div class="envelope-pocket-bottom"></div>
                
                <!-- Heart Seal -->
                <div class="heart-seal">
                    <i class="fa-solid fa-heart text-xl"></i>
                </div>

                <!-- Preview Parchment Inside -->
                <div class="letter flex flex-col justify-center items-center text-center">
                    <i class="fa-solid fa-heart text-rose-400 text-3xl mb-2"></i>
                    <p class="text-rose-700 font-semibold text-sm">চিঠিটি উম্মুক্ত হচ্ছে...</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Expanded Parchment Paper Modal (Active when opened) -->
    <div id="letterModal" class="letter-modal">
        <!-- Close / Re-fold button -->
        <button id="closeModalBtn" class="absolute top-4 right-4 text-rose-400 hover:text-rose-600 transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-rose-50">
            <i class="fa-solid fa-xmark text-xl"></i>
        </button>

        <!-- Romantic Parchment Layout -->
        <div class="relative pt-2">
            <!-- Header Decoration -->
            <div class="flex justify-between items-center border-b border-rose-100 pb-3 mb-4">
                <span class="text-xs font-semibold uppercase tracking-wider text-rose-400 font-handwriting text-lg">Hridoyer Kotha</span>
                <div class="flex gap-1 text-rose-400">
                    <i class="fa-solid fa-heart text-xs animate-ping"></i>
                    <i class="fa-solid fa-heart text-xs"></i>
                </div>
            </div>

            <!-- Letter Body -->
            <div class="text-gray-800 leading-relaxed text-base sm:text-lg min-h-[180px] whitespace-pre-line" id="letterBody">
                <span id="typedText"></span><span id="cursor" class="cursor"></span>
            </div>

            <!-- Footer / Signoff -->
            <div id="letterFooter" class="mt-8 pt-4 border-t border-rose-100 flex flex-col items-end opacity-0 transition-opacity duration-1000">
                <p class="text-xs text-rose-400">ভালোবাসার সাথে,</p>
                <p id="senderName" class="text-xl font-bold text-rose-700 font-handwriting mt-1">আপনার প্রিয়জন ❤️</p>
            </div>
        </div>

        <!-- Action Bar Inside Modal -->
        <div class="mt-6 flex justify-between items-center pt-2">
            <button id="replayBtn" class="text-xs text-rose-500 hover:text-rose-700 flex items-center gap-1">
                <i class="fa-solid fa-rotate-right"></i> পুনরায় অ্যানিমেট করুন
            </button>
            <div class="flex gap-2">
                <button id="shareBtn" class="bg-rose-500 hover:bg-rose-600 text-white text-xs px-3 py-2 rounded-lg flex items-center gap-1 shadow transition-all">
                    <i class="fa-solid fa-copy"></i> কপি টেক্সট
                </button>
            </div>
        </div>
    </div>

    <!-- Background Overlay for Modal -->
    <div id="modalOverlay" class="fixed inset-0 bg-rose-950/30 backdrop-blur-sm z-40 opacity-0 pointer-events-none transition-opacity duration-500"></div>

    <!-- Edit Message Modal -->
    <div id="editModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl transform scale-95 transition-all" id="editModalContent">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-rose-800 flex items-center gap-2">
                    <i class="fa-solid fa-pen text-rose-500"></i> চিঠি কাস্টমাইজ করুন
                </h3>
                <button id="closeEditModalBtn" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-rose-700 mb-1">প্রাপক / সম্বোধন:</label>
                    <input type="text" id="editSalutation" class="w-full px-3 py-2 border border-rose-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-400 text-sm" placeholder="যেমন: প্রিয়তমা,">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-rose-700 mb-1">ভালোবাসার মূল বার্তা:</label>
                    <textarea id="editContent" rows="5" class="w-full px-3 py-2 border border-rose-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-400 text-sm" placeholder="আপনার মনের কথা লিখুন..."></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-rose-700 mb-1">প্রেরকের নাম:</label>
                    <input type="text" id="editSender" class="w-full px-3 py-2 border border-rose-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-400 text-sm" placeholder="যেমন: তোমারি হৃদয়">
                </div>
            </div>

            <div class="mt-6 flex justify-end gap-2">
                <button id="cancelEditBtn" class="px-4 py-2 text-sm text-gray-500 hover:text-gray-700">বাতিল</button>
                <button id="saveEditBtn" class="px-5 py-2 text-sm bg-rose-500 hover:bg-rose-600 text-white font-medium rounded-lg shadow-md transition-all">সংরক্ষণ করুন</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white text-xs sm:text-sm px-4 py-2 rounded-full shadow-lg z-50 opacity-0 transition-opacity duration-300 pointer-events-none flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-rose-400"></i>
        <span id="toastMsg">বার্তা কপি করা হয়েছে!</span>
    </div>

    <!-- Footer -->
    <footer class="w-full text-center py-3 text-xs text-rose-700/70 z-10">
        ভালোবাসায় তৈরি ❤️ বিশেষ করে আপনার জন্য তৈরি করেছেন ( HM Abu Sayed Misbah ) 
    </footer>

    <script>
        /* Default Romantic Love Letter Content in Bengali */
        let letterData = {
            salutation: "প্রিয়,",
            body: "তুমি হয়তো জানো না, জীবনের ছোট ছোট মুহূর্তগুলো তোমার উপস্থিতিতে কতটা সুন্দর হয়ে ওঠে। সকালের মিষ্টি রোদ কিংবা রাতের নীরবতা—সবকিছুতেই যেন তোমার ছোঁয়া খুঁজে পাই।\n\nআমার হৃদয়ের প্রতিটা স্পন্দনে কেবল তোমারি সুর বাজে। এই ছোট্ট চিঠির প্রতিটি শব্দে লুকিয়ে আছে তোমার জন্য আমার অফুরন্ত ভালোবাসা। সারাজীবন তোমার হাতটি ধরে পাশে চলতে চাই।",
            sender: "তোমারি ভালোবাসার মানুষ ❤️"
        };

        // DOM Elements
        const envelope = document.getElementById('envelope');
        const instruction = document.getElementById('instruction');
        const letterModal = document.getElementById('letterModal');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const typedTextEl = document.getElementById('typedText');
        const cursorEl = document.getElementById('cursor');
        const letterFooter = document.getElementById('letterFooter');
        const senderNameEl = document.getElementById('senderName');
        
        // Edit Elements
        const editBtn = document.getElementById('editBtn');
        const editModal = document.getElementById('editModal');
        const editModalContent = document.getElementById('editModalContent');
        const closeEditModalBtn = document.getElementById('closeEditModalBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const saveEditBtn = document.getElementById('saveEditBtn');
        const editSalutation = document.getElementById('editSalutation');
        const editContent = document.getElementById('editContent');
        const editSender = document.getElementById('editSender');

        const replayBtn = document.getElementById('replayBtn');
        const shareBtn = document.getElementById('shareBtn');
        const musicBtn = document.getElementById('musicBtn');
        const musicIcon = document.getElementById('musicIcon');

        // Typing effect state
        let isTyping = false;
        let typeTimeout = null;

        /* Floating Hearts Animation Generator */
        function createHeart() {
            const heartsContainer = document.getElementById('hearts-container');
            const heart = document.createElement('i');
            
            // Random heart icons & colors
            const icons = ['fa-heart', 'fa-heart text-pink-400', 'fa-heart text-rose-300', 'fa-heart text-red-400'];
            const randomIcon = icons[Math.floor(Math.random() * icons.length)];
            
            heart.className = `fa-solid ${randomIcon} heart-particle`;
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
            
            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        // Periodically generate hearts
        setInterval(createHeart, 400);

        /* Web Audio API for Soft Background Melody */
        let audioCtx = null;
        let isPlaying = false;
        let melodyInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Soft music tone generator
        function playSoftNote(freq, duration = 1.2) {
            if (!audioCtx || audioCtx.state !== 'running') return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine'; // Soft musical sine wave
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                // Gentle Attack & Decay Envelope
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.2);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio error", e);
            }
        }

        // Romantic Ambient Arpeggio Sequence
        const notes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23, 329.63, 293.66]; // C E G C A F E D
        let noteIdx = 0;

        function toggleMusic() {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (isPlaying) {
                // Stop Music
                clearInterval(melodyInterval);
                isPlaying = false;
                musicIcon.className = "fa-solid fa-music";
                musicBtn.classList.remove('music-pulse', 'bg-rose-100');
            } else {
                // Start Music
                isPlaying = true;
                musicIcon.className = "fa-solid fa-volume-high text-rose-600";
                musicBtn.classList.add('music-pulse', 'bg-rose-100');

                // Play soft recurring sequence
                melodyInterval = setInterval(() => {
                    playSoftNote(notes[noteIdx], 1.5);
                    noteIdx = (noteIdx + 1) % notes.length;
                }, 600);
            }
        }

        musicBtn.addEventListener('click', toggleMusic);

        /* Typewriter Animation Effect */
        function startTypewriter() {
            // Reset text
            typedTextEl.innerHTML = '';
            cursorEl.style.display = 'inline-block';
            letterFooter.style.opacity = '0';
            
            const fullText = `${letterData.salutation}\n\n${letterData.body}`;
            let i = 0;
            isTyping = true;

            if (typeTimeout) clearTimeout(typeTimeout);

            function typeNextChar() {
                if (i < fullText.length) {
                    const char = fullText.charAt(i);
                    if (char === '\n') {
                        typedTextEl.innerHTML += '<br>';
                    } else {
                        typedTextEl.innerHTML += char;
                    }
                    i++;
                    
                    // Add subtle typing sound effect
                    if (isPlaying && i % 3 === 0) {
                        playSoftNote(800 + Math.random() * 200, 0.05);
                    }

                    // Variable speed for realism
                    const speed = char === ',' || char === '।' || char === '—' ? 250 : (Math.random() * 30 + 35);
                    typeTimeout = setTimeout(typeNextChar, speed);
                } else {
                    isTyping = false;
                    cursorEl.style.display = 'none';
                    // Show footer smoothly
                    senderNameEl.innerText = letterData.sender;
                    letterFooter.style.opacity = '1';
                }
            }

            typeNextChar();
        }

        /* Envelope Open Animation Logic */
        function openEnvelope() {
            if (envelope.classList.contains('open')) return;

            // Start audio if not already running on user click
            if (!isPlaying) {
                toggleMusic();
            }

            envelope.classList.add('open');
            instruction.style.opacity = '0';

            // After envelope flap opens, display paper modal
            setTimeout(() => {
                modalOverlay.classList.remove('pointer-events-none');
                modalOverlay.classList.add('opacity-100');
                letterModal.classList.add('active');

                // Trigger typewriter
                setTimeout(startTypewriter, 300);
            }, 700);
        }

        function closeEnvelopeModal() {
            letterModal.classList.remove('active');
            modalOverlay.classList.remove('opacity-100');
            modalOverlay.classList.add('pointer-events-none');

            // Reset envelope flap after modal closes
            setTimeout(() => {
                envelope.classList.remove('open');
                instruction.style.opacity = '1';
                if (typeTimeout) clearTimeout(typeTimeout);
            }, 400);
        }

        envelope.addEventListener('click', openEnvelope);
        closeModalBtn.addEventListener('click', closeEnvelopeModal);
        modalOverlay.addEventListener('click', closeEnvelopeModal);

        /* Replay Typing */
        replayBtn.addEventListener('click', () => {
            if (!isTyping) {
                startTypewriter();
            }
        });

        /* Toast Helper */
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }

        /* Share / Copy Functionality */
        shareBtn.addEventListener('click', () => {
            const fullMessage = `${letterData.salutation}\n\n${letterData.body}\n\n— ${letterData.sender}`;
            
            // Legacy copy support for iframe context
            const tempInput = document.createElement('textarea');
            tempInput.value = fullMessage;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');
                showToast("চিঠির কথাগুলো কপি করা হয়েছে!");
            } catch (err) {
                showToast("কপি করা সম্ভব হয়নি");
            }
            document.body.removeChild(tempInput);
        });

        /* Edit Modal Logic */
        function openEditModal() {
            editSalutation.value = letterData.salutation;
            editContent.value = letterData.body;
            editSender.value = letterData.sender;

            editModal.classList.remove('pointer-events-none', 'opacity-0');
            editModal.classList.add('opacity-100');
            editModalContent.classList.remove('scale-95');
            editModalContent.classList.add('scale-100');
        }

        function closeEditModal() {
            editModal.classList.add('pointer-events-none', 'opacity-0');
            editModal.classList.remove('opacity-100');
            editModalContent.classList.remove('scale-100');
            editModalContent.classList.add('scale-95');
        }

        editBtn.addEventListener('click', openEditModal);
        closeEditModalBtn.addEventListener('click', closeEditModal);
        cancelEditBtn.addEventListener('click', closeEditModal);

        saveEditBtn.addEventListener('click', () => {
            const sal = editSalutation.value.trim();
            const body = editContent.value.trim();
            const sender = editSender.value.trim();

            if (!sal || !body || !sender) {
                showToast("দয়া করে সবগুলো ঘর পূরণ করুন");
                return;
            }

            letterData.salutation = sal;
            letterData.body = body;
            letterData.sender = sender;

            closeEditModal();
                showToast("চিঠি আপডেট করা হয়েছে! ❤️");

            // If modal is currently active, replay typewriter with new content
            if (letterModal.classList.contains('active')) {
                startTypewriter();
            }
        });
    </script>
</body>
</html>
